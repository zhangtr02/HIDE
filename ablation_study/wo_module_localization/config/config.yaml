paths:
  dataset_dir: ../../rustcbugs
  run_dir: ../../run
  log_dir: ../../logs
  report_dir: reports
  query_trace_dir: ../../query_traces
  evidence_dir: ../../evidence
  file_doc_dir: ../../docs_file
  module_doc_dir: ../../docs_module
  crate_doc_dir: ../../docs_crate
  issue_dir: ../../issues
  groundtruth_dir: ../../groundtruth
  method_groundtruth_dir: ../../method_groundtruth
  rust_repo_dir: rust
  csv_file: ../../rustcbugs.csv
  xlsx_file: ../../rustcbugs_info.xlsx

llm:
  base_url: "https://yunwu.ai/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_tokens: 1600
  prefer_json_object: true

docgen:
  max_code_chars: 12000
  file_doc_batch_size: 64
  max_tokens: 6000

localize:
  candidate_agent_max_tokens: 5000
  code_agent_max_tokens: 7000
  max_code_chars: 10000
  stage1_crate_count: 4
  stage2_module_count: 12
  stage3_file_per_module_count: 4
  stage3_root_file_per_crate_count: 2
  stage3_file_merge_count: 10
  stage3_file_eval_top_k: 10
  stage4_method_input_file_count: 10
  stage4_method_per_file_count: 5
  stage4_method_final_top_k: 10
