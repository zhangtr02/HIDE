paths:
  dataset_dir: ../../rustcbugs
  run_dir: ../../run
  log_dir: ../../logs
  report_dir: reports
  query_trace_dir: ../../query_traces
  evidence_dir: ../../evidence
  file_doc_dir: ../../docs_file
  issue_dir: ../../issues
  groundtruth_dir: ../../groundtruth
  rust_repo_dir: rust
  csv_file: ../../rustcbugs.csv
  xlsx_file: ../../rustcbugs_info.xlsx

llm:
  base_url: "https://yunwu.ai/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_tokens: 1600
  prefer_json_object: true

docgen:
  max_code_chars: 12000
  file_doc_batch_size: 64
  max_tokens: 6000

localize:
  candidate_agent_max_tokens: 5000
  issue_max_chars: 24000
  repro_max_chars: 24000
  stage3_file_eval_top_k: 10
