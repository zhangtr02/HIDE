paths:
  dataset_csv: gccbugs_200.csv
  issue_dir: issues
  reproducer_dir: gccbugs
  run_dir: run
  pass_trace_dir: pass_traces
  evidence_dir: evidence
  groundtruth_dir: groundtruth
  method_groundtruth_dir: method_groundtruth
  report_dir: reports
  gcc_repo_dir: gcc
  module_doc_dir: docs_module
  file_doc_dir: docs_file

llm:
  base_url: "https://yunwu.ai/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_tokens: 1600
  prefer_json_object: true
  request_retries: 8
  retry_initial_delay_sec: 2.0
  retry_max_delay_sec: 60.0

docgen:
  max_code_chars: 12000
  file_doc_batch_size: 64
  same_name_group_batch_size: 8
  same_name_file_batch_size: 24
  max_tokens: 6000

localize:
  candidate_agent_max_tokens: 5000
  code_agent_max_tokens: 7000
  issue_max_chars: 24000
  reproducer_max_chars: 24000
  pass_trace_max_items: 200
  stage1_module_count: 12
  stage2_file_per_module_count: 4
  stage2_file_merge_count: 10
  stage2_file_eval_top_k: 10
  stage4_method_input_file_count: 10
  stage4_method_per_file_count: 5
  stage4_method_final_top_k: 10

pass_trace:
  timeout_sec: 120
  extra_args: "-c -fdump-passes"
  default_c_args: ""
  default_cxx_args: ""
  default_fortran_args: ""
  max_output_chars: 200000
