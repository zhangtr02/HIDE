paths:
  project_root: ../..
  issue_dir: issues
  groundtruth_dir: groundtruth
  method_groundtruth_dir: method_groundtruth
  rust_repo_dir: baselines/graphlocator_rustc/rust
  csv_file: rustcbugs.csv
  report_dir: reports
  graph_cache_dir: graph_cache

llm:
  base_url: "https://www.autodl.art/api/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_completion_tokens: 8192

graphlocator:
  # Set to true only when method-level results are required. Graph construction
  # and causal reasoning remain unchanged because file results depend on them.
  run_method_level: false
  search_topk: 5
  max_search_turn: 5
  max_causal_turn: 20
  file_top_n: 10
  method_top_n: 10
  max_causal_code_elements: 80
  max_causal_node_content_chars: 4000
  max_existing_node_content_chars: 1200
  max_causal_prompt_chars: 350000
