paths:
  project_root: ../..
  issue_dir: gcc-cbi/issues
  groundtruth_dir: gcc-cbi/groundtruth
  method_groundtruth_dir: gcc-cbi/method_groundtruth
  gcc_repo_dir: baselines/graphlocator_gcc/gcc
  csv_file: gcc-cbi/gccbugs_200.csv
  report_dir: reports
  graph_cache_dir: graph_cache

llm:
  base_url: "https://yunwu.ai/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_completion_tokens: 8192

graphlocator:
  search_topk: 5
  max_search_turn: 5
  max_causal_turn: 20
  file_top_n: 10
  method_top_n: 10
  max_causal_code_elements: 80
  max_causal_node_content_chars: 4000
  max_existing_node_content_chars: 1200
  max_causal_prompt_chars: 350000
  expand_dependencies_in_search: false
  expand_dependencies_in_causal: true
  dependency_max_files: 4
  dependency_max_nodes_per_file: 500
  include_file_dependencies: true
  include_class_dependencies: true
  include_method_dependencies: false
