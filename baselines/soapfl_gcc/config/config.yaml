paths:
  gcc_repo_dir: gcc
  csv_file: ../../gcc-cbi/gccbugs_200.csv
  issue_dir: ../../gcc-cbi/issues
  groundtruth_dir: ../../gcc-cbi/groundtruth
  method_groundtruth_dir: ../../gcc-cbi/method_groundtruth
  report_dir: reports
  docs_file_dir: docs_file
  docs_method_dir: docs_method

llm:
  base_url: "https://yunwu.ai/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_tokens: 1600
  prefer_json_object: true

soapfl:
  file_top_n: 10
  method_top_k: 10
  file_chunk_size: 500
  file_chunk_select_n: 5
  issue_chars: 30000
  file_summary_chars: 800
  method_search_chunk_size: 160
  method_search_chunk_select_n: 3
  related_methods_per_file: 2
  max_methods_to_review: 15
  method_review_batch_size: 10
  method_review_code_chars: 2500
  method_selection_max_tokens: 1400
  method_review_max_tokens: 900
