paths:
  rust_repo_dir: rust
  csv_file: ../../rustcbugs.csv
  dataset_dir: ../../rustcbugs
  run_dir: ../../run
  log_dir: ../../logs
  groundtruth_dir: ../../groundtruth
  method_groundtruth_dir: ../../method_groundtruth
  report_dir: reports
  docs_file_dir: docs_file
  docs_method_dir: docs_method

llm:
  base_url: "https://www.autodl.art/api/v1"
  model: "gpt-5.4"
  temperature: 0.0
  timeout_sec: 1000
  max_tokens: 1600
  prefer_json_object: true

soapfl:
  # Set to true only for method-level experiments.
  run_method_level: false
  file_top_n: 10
  method_top_k: 10
  file_chunk_size: 120
  file_chunk_select_n: 4
  file_summary_chars: 4000
  file_summary_max_tokens: 220
  reproducer_chars: 8000
  error_chars: 4000
  method_doc_chunk_size: 30
  method_doc_code_chars: 900
  method_doc_max_tokens: 1000
  method_selection_max_tokens: 900
  method_review_code_chars: 2500
  method_review_max_tokens: 600
  related_methods_per_file: 2
  max_methods_to_review: 20
